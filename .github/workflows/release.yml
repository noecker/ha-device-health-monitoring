name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Create Release Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.get_version.outputs.VERSION }}"/' custom_components/device_health_exclusions/manifest.json

      - name: Create integration package
        run: |
          cd custom_components
          zip -r ../device_health_exclusions-${{ steps.get_version.outputs.VERSION }}.zip device_health_exclusions/

      - name: Create complete package
        run: |
          mkdir -p complete_package
          cp -r custom_components complete_package/
          cp device_health_report.yaml device_health_majordomo.yaml complete_package/
          cp README.md QUICKSTART.md INSTALLATION.md MAJORDOMO.md complete_package/
          cd complete_package
          zip -r ../device_health_monitoring-complete-${{ steps.get_version.outputs.VERSION }}.zip .

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            device_health_exclusions-${{ steps.get_version.outputs.VERSION }}.zip \
            device_health_monitoring-complete-${{ steps.get_version.outputs.VERSION }}.zip \
            --repo "${{ github.repository }}" --clobber
